<title>Киновечер Шафл</title>
<style>
/* Layout: black stage with the poster in the middle and equalizer bars on both sides; catalog and film page share the same dark shell.
   Palette: black, graphite, one lime accent. */
@font-face { font-family: "YS Text"; src: url(ys-text-light.ttf) format("truetype"); font-weight: 300; font-style: normal; font-display: swap; }
@font-face { font-family: "YS Text"; src: url(ys-text-regular.ttf) format("truetype"); font-weight: 400 500; font-style: normal; font-display: swap; }
@font-face { font-family: "YS Text"; src: url(ys-text-italic.ttf) format("truetype"); font-weight: 300 500; font-style: italic; font-display: swap; }
@font-face { font-family: "YS Text"; src: url(ys-text-bold.ttf) format("truetype"); font-weight: 600 900; font-style: normal; font-display: swap; }
@font-face { font-family: "YS Display"; src: url(ys-display.ttf) format("truetype"); font-weight: 100 900; font-style: normal; font-display: swap; }
:root {
  --bg: #0a0a0a; --surface: #161616; --fg: #f3f3ef; --muted: #9b9b95; --line: #2b2b2b;
  --accent: #c6f24e; --accent-fg: #0a0a0a; --win: #9be8a8; --bar: #303030; --bar2: #2a2a2a; --heart: #ff4d5e;
  --font-display: "YS Display", "YS Text", Arial, sans-serif;
  --font-body: "YS Text", Arial, sans-serif;
  --font-mono: "YS Text", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.55; padding-inline: 20px; padding-block: 0 56px; }
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1120px; margin-inline: auto; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 18px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .02em; text-decoration: none; display: flex; align-items: center; gap: 10px; }
.brand i { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); display: inline-block; position: relative; }
.brand i::after { content: ""; position: absolute; inset: 6px 6px 6px 8px; background: var(--accent-fg); clip-path: polygon(0 0, 100% 50%, 0 100%); }
.top-r { display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 14px; }
.btn-ghost { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 13px; color: var(--muted); }
.btn-ghost:hover { color: var(--fg); border-color: var(--muted); }

/* catalog */
.hero { padding-block: 28px 24px; display: grid; gap: 12px; max-width: 760px; }
.hero h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(28px, 5.4vw, 52px); line-height: 1.08; letter-spacing: -.01em; }
.hero p { margin: 0; color: var(--muted); font-size: 18px; max-width: 56ch; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 18px; }
.row { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: flex-end; }
.field { display: grid; gap: 6px; min-width: 0; align-content: start; }
.lbl { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
input[type="time"], select { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 40px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start; align-content: flex-start; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 7px 14px; min-height: 38px; cursor: pointer; font-size: 14px; }
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.chip small { font-family: var(--font-mono); opacity: .7; margin-left: 4px; font-size: 11px; }
.check { display: flex; align-items: center; gap: 8px; min-height: 40px; cursor: pointer; font-size: 15px; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.btn { background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 10px; padding: 11px 20px; font-weight: 600; cursor: pointer; min-height: 44px; }
.btn:hover { filter: brightness(1.08); }
.btn-line { background: none; color: var(--fg); border: 1px solid var(--line); }
.spacer { flex: 1 1 auto; }
.count { margin-block: 22px 14px; color: var(--muted); font-size: 14px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 26px 20px; }
.card { text-decoration: none; display: grid; gap: 10px; align-content: start; min-width: 0; }
.card .ph { position: relative; aspect-ratio: 2 / 3; border-radius: 10px; overflow: hidden; background: var(--line); }
.card img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .35s ease; }
.card:hover img { transform: scale(1.03); }
.card:hover h3 { color: var(--accent); }
.kp { position: absolute; top: 8px; right: 8px; background: var(--bg); color: var(--fg); border-radius: 6px; padding: 2px 7px; font-family: var(--font-mono); font-size: 13px; font-weight: 500; }
.card h3 { font-size: 17px; font-weight: 600; line-height: 1.25; }
.meta { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; }
.logline { color: var(--muted); font-size: 14.5px; margin: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.ends { font-family: var(--font-mono); font-size: 12.5px; color: var(--accent); }
.empty { padding: 48px 0; text-align: center; color: var(--muted); display: grid; gap: 14px; justify-items: center; }

/* film page */
.back { display: inline-flex; gap: 8px; text-decoration: none; color: var(--muted); font-size: 14px; padding-block: 6px; }
.back:hover { color: var(--fg); }
.film { display: grid; grid-template-columns: minmax(0, 330px) minmax(0, 1fr); gap: 40px; padding-block: 12px 24px; align-items: start; }
.film .poster { position: sticky; top: 16px; }
.film .poster img { width: 100%; height: auto; border-radius: 12px; display: block; background: var(--line); }
.film .main { display: grid; gap: 34px; min-width: 0; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.film h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(26px, 4.4vw, 44px); line-height: 1.1; margin-block: 8px 8px; }
.orig { color: var(--muted); font-size: 15px; }
.facts-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.pill { border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font-family: var(--font-mono); font-size: 13px; background: var(--surface); }
.lead { font-size: clamp(18px, 2.2vw, 22px); line-height: 1.45; margin: 0; max-width: 46ch; }
.tonight { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; }
.tonight .big { font-family: var(--font-display); font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; }
.tonight .t { display: grid; gap: 2px; }
.sec { display: grid; gap: 12px; }
.sec h2 { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .1em; font-weight: 500; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.sec p { margin: 0; max-width: 68ch; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 20px; }
.two h3 { font-size: 13px; color: var(--muted); font-weight: 500; margin-bottom: 4px; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 14px; }
.list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.list li { display: flex; justify-content: space-between; gap: 16px; border-bottom: 1px dashed var(--line); padding-bottom: 8px; }
.list li span:last-child { color: var(--muted); text-align: right; }
.dl { display: grid; grid-template-columns: max-content 1fr; gap: 8px 22px; margin: 0; }
.dl dt { color: var(--muted); font-size: 14px; }
.dl dd { margin: 0; min-width: 0; }
.win, .nom { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; border-radius: 5px; padding: 2px 6px; white-space: nowrap; align-self: start; }
.win { color: var(--win); border: 1px solid var(--win); }
.nom { color: var(--muted); border: 1px solid var(--line); }
.aw { display: grid; gap: 10px; list-style: none; padding: 0; margin: 0; }
.aw li { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; }
.aw b { font-weight: 600; }
.aw span { color: var(--muted); font-size: 14px; display: block; }
.link { color: var(--accent); font-weight: 500; }
details { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--surface); }
summary { cursor: pointer; font-size: 14px; color: var(--muted); }
details ul { margin: 12px 0 0; padding-left: 18px; font-size: 14px; color: var(--muted); display: grid; gap: 6px; }
.banner { background: var(--accent); color: var(--accent-fg); border-radius: 12px; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.banner .btn { background: var(--accent-fg); color: var(--accent); min-height: 38px; padding: 7px 14px; }
.sim { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 140px), 1fr)); gap: 16px; }
.sim .card h3 { font-size: 15px; }
.foot { margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; display: grid; gap: 6px; }
.foot a { color: var(--muted); }

/* survey + filters */
.survey { gap: 16px; }
.now { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 14px; color: var(--muted); }
.now .sep { opacity: .5; }
.linkbtn { background: none; border: 0; padding: 2px 0; color: var(--accent); cursor: pointer; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }
.linkbtn.mono { font-size: 14px; }
.qs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 18px 28px; }
.chip:disabled { opacity: .4; cursor: not-allowed; }
.chip.ghost { border-style: dashed; color: var(--muted); }
.hint { color: var(--muted); font-size: 14px; }
.fbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px 20px; margin-top: 14px; }
.fl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; min-width: 0; }
.act { display: flex; flex-wrap: wrap; gap: 6px; }
.none { color: var(--muted); font-size: 14px; }
.xchip { display: inline-flex; align-items: center; gap: 2px; background: var(--surface); border: 1px solid var(--accent); color: var(--fg); border-radius: 999px; padding: 2px 4px 2px 12px; font-size: 14px; }
.xchip button { background: none; border: 0; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; color: var(--muted); font-size: 18px; line-height: 1; }
.xchip button:hover { color: var(--fg); background: var(--line); }
.fr { display: flex; gap: 18px; }
.more { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-top: 10px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 16px 24px; }
.more[hidden] { display: none; }
.more .wide { grid-column: 1 / -1; }
input[type="search"] { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 40px; width: 100%; }
.why { font-size: 13px; color: var(--muted); border: 1px dashed var(--line); border-radius: 6px; padding: 2px 8px; justify-self: start; }
.sub { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .1em; font-weight: 500; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-block: 34px 18px; }
.note { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
.moreWrap { display: flex; justify-content: center; margin-top: 30px; }
@media (max-width: 760px) {
  .film { grid-template-columns: minmax(0, 1fr); gap: 24px; }
  .film .poster { position: static; max-width: 260px; }
  .dl { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .dl dd { margin-bottom: 10px; }
  .grid { gap: 22px 14px; }
}
@media (prefers-reduced-motion: reduce) { .card img { transition: none; } }

/* remove from favourites: heart on cards, cross on the ticket thumbnails */
.cardw { position: relative; min-width: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#results .cardw { container-type: inline-size; }
#results .card { gap: 4.2cqw; }
#results .card h3 { font-size: 8.2cqw; font-weight: 400; line-height: 1.15; }
#results .card .meta { font-family: var(--font-body); font-size: 5.8cqw; line-height: 1.2; color: var(--muted); gap: 0; flex-wrap: wrap; }
#results .card .meta span + span::before { content: "•"; margin: 0 .4em; font-size: .8em; }
#results .card .ends { font-size: 5.2cqw; }
#results .card .logline { font-size: 5.6cqw; }
.cfav { position: absolute; top: 8px; left: 8px; width: 40px; height: 40px; border-radius: 12px; border: 1px solid rgba(255,255,255,.18); background: rgba(10,10,10,.72); color: #fff; display: grid; place-items: center; cursor: pointer; padding: 0; backdrop-filter: blur(6px); z-index: 2; }
.cfav::before { content: ""; position: absolute; inset: -4px; }
.cfav svg { width: 22px; height: 22px; display: block; }
.cfav:hover { background: rgba(10,10,10,.92); }
.cfav[aria-pressed="true"] { color: var(--heart); }
.cfav:focus-visible, .thx:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.thw { position: relative; display: block; }
.thx { position: absolute; top: -7px; right: -7px; width: 24px; height: 24px; border-radius: 50%; border: 1px solid #3a3a3a; background: #0a0a0a; color: #fff; font-size: 16px; line-height: 1; cursor: pointer; padding: 0; display: grid; place-items: center; z-index: 2; }
.thx::before { content: ""; position: absolute; inset: -10px; }
.thx:hover { background: var(--heart); border-color: var(--heart); color: #0a0a0a; }

.navs { position: relative; display: inline-flex; }
.nav .navs > a { gap: 8px; }
.fchev { width: 16px; height: 16px; flex: none; transition: transform .25s; }
#shufbtn[aria-expanded="true"] .fchev { transform: rotate(180deg); }
.nav a[aria-current="page"].fcur, #shufbtn:not([aria-current]) .fchev { opacity: .7; }
.fbadge { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--accent); color: #0a0a0a; font: 700 13px/22px var(--font-body, system-ui); text-align: center; }
#shufbtn:not([aria-current]) .fbadge { background: var(--accent); }
.fpanel { position: absolute; z-index: 90; top: calc(100% + 10px); left: 0; width: min(420px, calc(100vw - 32px)); max-height: calc(100svh - 150px); overflow: auto; background: #fff; color: #111; border-radius: 28px; padding: 0 22px 20px; box-shadow: 0 24px 70px rgba(0,0,0,.65); animation: fin .22s ease-out; }
.fpanel[hidden] { display: none; }
@keyframes fin { from { opacity: 0; transform: translateY(-8px) scale(.98); } to { opacity: 1; transform: none; } }
.fhead { position: sticky; top: 0; z-index: 3; background: #fff; display: flex; align-items: center; justify-content: space-between; padding: 22px 0 10px; margin-bottom: 4px; }
.fhead { align-items: flex-start; gap: 12px; }
.fhead h2 { font: 500 24px/1.25 var(--font-body, system-ui); padding-top: 4px; }
.freset { flex: none; }
.freset { border: 0; background: none; font: 500 15px var(--font-body, system-ui); color: #555; padding: 10px 6px; min-height: 44px; cursor: pointer; border-radius: 10px; }
.freset:disabled { opacity: .35; cursor: default; }
.freset:not(:disabled):hover { color: #000; }
.fchips, .fopts { display: flex; flex-wrap: wrap; gap: 8px; }
.fchip, .fopt { border: 0; cursor: pointer; font: 400 17px var(--font-body, system-ui); color: #111; background: #e0e0e0; border-radius: 25px; padding: 0 20px; min-height: 48px; display: inline-flex; align-items: center; gap: 8px; transition: background .15s, color .15s; }
.fchip:hover, .fopt:hover { background: #d3d3d3; }
.fchip[aria-pressed="true"], .fopt[aria-pressed="true"] { background: #161616; color: #fff; }
.fchip[aria-expanded="true"] .fchev { transform: rotate(180deg); }
.fchip .fchev { width: 14px; height: 14px; opacity: .6; }
.fopts { position: fixed; z-index: 130; width: max-content; max-width: min(400px, calc(100vw - 24px)); padding: 12px; border-radius: 22px; background: #f3f3f3; border: 1px solid #dcdcdc; box-shadow: 0 18px 50px rgba(0,0,0,.35); }
.fopts:has(.yr) { width: min(320px, calc(100vw - 24px)); }
.fopt { background: #fff; min-height: 42px; font-size: 16px; padding: 0 16px; box-shadow: inset 0 0 0 1px #d8d8d8; }
.fopt[aria-pressed="true"] { box-shadow: none; }
.yr { width: 100%; padding: 4px 6px 0; }
.yr-val { display: flex; justify-content: center; align-items: baseline; gap: 10px; font: 600 24px var(--font-body, system-ui); margin-bottom: 14px; color: #111; }
.yr-val span { color: #999; font-weight: 400; }
.yr-track { position: relative; height: 32px; }
.yr-track::before { content: ""; position: absolute; left: 0; right: 0; top: 13px; height: 6px; border-radius: 3px; background: #d4d4d4; }
.yr-fill { position: absolute; top: 13px; height: 6px; border-radius: 3px; background: #161616; }
.yr-in { position: absolute; left: 0; top: 0; width: 100%; height: 32px; margin: 0; background: none; pointer-events: none; -webkit-appearance: none; appearance: none; }
.yr-in::-webkit-slider-runnable-track { background: none; height: 32px; }
.yr-in::-moz-range-track { background: none; }
.yr-in::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; pointer-events: auto; width: 28px; height: 28px; border-radius: 50%; background: #161616; border: 0; box-shadow: none; cursor: grab; }
.yr-in::-moz-range-thumb { pointer-events: auto; width: 28px; height: 28px; border-radius: 50%; background: #161616; border: 0; box-shadow: none; cursor: grab; }
.yr-in:focus-visible::-webkit-slider-thumb { outline: 3px solid #5b8cff; outline-offset: 2px; }
.yr-cap { text-align: center; font: 400 14px var(--font-body); color: #888; margin-bottom: 4px; }
.cfb .yr-cap { color: #8a8a85; }
.yr-ends { display: flex; justify-content: space-between; margin-top: 8px; color: #888; font-size: 13px; }
.fapply { display: block; width: 100%; margin-top: 18px; min-height: 56px; border: 0; border-radius: 28px; background: #c6ea63; color: #111; font: 500 18px var(--font-body, system-ui); cursor: pointer; transition: filter .15s, transform .1s; }
.fapply:hover:not(:disabled) { filter: brightness(1.06); }
.fapply:active:not(:disabled) { transform: scale(.985); }
.fapply:disabled { background: #e0e0e0; color: #777; cursor: default; }
.fpanel button:focus-visible { outline: 3px solid #111; outline-offset: 2px; }
.fscrim { display: none; }
@media (max-width: 700px) {
  .navs { position: static; }
  .fpanel { position: fixed; left: 8px; right: 8px; width: auto; top: auto; bottom: calc(8px + env(safe-area-inset-bottom)); max-height: 82svh; border-radius: 28px; z-index: 120; animation: sheet .28s cubic-bezier(.2,.8,.2,1); }
  @keyframes sheet { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  body.fopen::after { content: ""; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 70; }
}
/* shell */
.wrap { max-width: 1440px; }
#app.narrow { max-width: none; }
@media (max-width: 760px) { .heart { width: 44px; height: 44px; right: 10px; bottom: 10px; } }
.top2 { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px 16px; padding-block: 20px; }
:root { --navh: 52px; }
html, body { margin: 0; }
body, button, input, select, textarea { font-family: var(--font-body); }
.mono, .meta, .ends, .kp, .pill, .cnt, .lbl, small { font-variant-numeric: tabular-nums; }
.top2 { position: sticky; top: 0; z-index: 80; background: transparent; }
.top2::before { content: ""; position: absolute; z-index: -1; top: 0; bottom: 0; left: 50%; width: 100vw; transform: translateX(-50%); background: linear-gradient(180deg, rgba(46,46,46,.5), rgba(14,14,14,.42)); -webkit-backdrop-filter: blur(22px) saturate(1.7); backdrop-filter: blur(22px) saturate(1.7); box-shadow: inset 0 1px 0 rgba(255,255,255,.1); }
html, body { overflow-x: clip; }
.film .poster { top: calc(var(--hdr, 92px) + 12px); }
.top2 .brand { justify-self: start; display: block; height: var(--navh); line-height: 0; border-radius: 12px; }
.brand svg { height: 100%; width: auto; display: block; fill: #333; stroke: #333; }
.brand:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
.nav { display: flex; gap: 4px; }
.nav a { text-decoration: none; padding: 12px 22px; border-radius: 18px; font-size: 18px; color: var(--fg); height: var(--navh); box-sizing: border-box; display: inline-flex; align-items: center; }
.nav a:hover { background: var(--surface); }

в Югов", "name_original": "Vyacheslav Yugov", "role": "отец Василий", "participation_type": "актёр", "source_ids": ["imdb_credits", "kp_cast"]}, {"name_ru": "Елена Маркова", "name_original": "Elena Markova", "role": "Февронья", "participation_type": "актёр", "source_ids": ["imdb_credits", "kp_cast"]}], "content": {"logline": "Якутский крестьянин, страдающий приступами летаргического сна, следует за художником в экспедицию, чтобы однажды не оказаться похороненным заживо.", "synopsis": "Якутия, 1910 год. Степан Бересеков живёт среди людей, которым трудно понять его необычное состояние: время от времени он впадает в сон, почти неотличимый от смерти. Художник и исследователь Иван Попов умеет распознавать эти приступы и становится для Степана человеком, которому можно доверить собственную жизнь. Но Ивану предстоит долгая этнографическая экспедиция. Не желая оставаться без своего защитника, Степан решает отправиться вслед за ним. Дорога ведёт путешественников через селения и открытые просторы, знакомит с разными людьми, обычаями и историями. Пока Иван собирает предметы и свидетельства местной культуры, его спутник по-своему воспринимает красоту окружающего мира. Их совместный путь соединяет бытовые трудности, смешные недоразумения и моменты тихого удивления, постепенно превращаясь в историю доверия, человеческой чуткости и внимательного отношения к жизни.", "themes": ["дружба и доверие", "способность видеть красоту", "страх смерти и любовь к жизни", "культурная память"], "mood": "Тёплое, созерцательное и мягко ироничное; тревога за уязвимого героя соседствует с радостью открытия мира.", "visual_style": "Цветное изображение в формате 4:3, напоминающем исторические фотографии; спокойные композиции, естественные пейзажи и внимание к лицам, одежде и предметам быта. Свет и протяжённость дорожных сцен создают неспешный ритм."}, "context": {"text": "Любовь Борисова обратилась к истории художника и этнографа Ивана Попова и его знакомого Степана Бересекова после публикации историка Александра Дьяконова. Сценарий она дорабатывала вместе с Юлией Клименко; фильм произвели «Сахафильм» и московская студия «Автор». Фотографии Попова, музейные каталоги и консультации исследователей помогли восстановить облик эпохи. Исполнителя Степана, школьного учителя Александра Чичахова, режиссёр встретила во время поездки со своим предыдущим фильмом. Редакционная интерпретация: картина соединяет современное якутское авторское кино с местной исторической памятью, выбирая дружбу и восприимчивость к красоте главными проводниками в прошлое. Дорожная форма позволяет показать культуру через встречи и повседневные занятия, сохраняя самостоятельность персонажей и не превращая их в иллюстрации к учебнику.", "facts": [{"text": "По словам Любови Борисовой, импульсом к сценарию стал пост историка Александра Дьяконова с рассказом и фотографиями Ивана Попова и Степана Бересекова.", "source_ids": ["production_interview"]}, {"text": "Александр Чичахов, сыгравший Степана, работал школьным учителем труда; режиссёр заметила его во время поездки в село Ой.", "source_ids": ["production_interview"]}, {"text": "Семён Аманатов объяснил выбор формата 4:3 желанием оживить фотографии Ивана Попова.", "source_ids": ["camera_interview"]}]}, "release": {"world_premiere": {"date": "05122022", "year": 2022, "event": "Москва, кинотеатр «Художественный», фестиваль «Зимний»; самый ранний подтверждённый премьерный показ", "release_type": "festival_premiere", "source_ids": ["premiere", "kp"]}, "russian_premiere": {"date": "05122022", "year": 2022, "event": "Москва, фестиваль «Зимний»", "release_type": "festival_premiere", "source_ids": ["premiere", "kp"]}, "additional_releases": [{"date": "22122022", "year": 2022, "event": "Якутия: региональный кинопрокат", "release_type": "regional_theatrical_release", "source_ids": ["regional_release", "box_office"]}, {"date": "26012023", "year": 2023, "event": "Россия: федеральный кинопрокат, Reflexion Films", "release_type": "wide_theatrical_release", "source_i tps://www.kinopoisk.ru/film/1259195/", "imdb_id": "tt10045136", "imdb_url": "https://www.imdb.com/title/tt10045136/", "title_ru": "Война искусств", "title_original": "War of Art", "alternative_titles": [], "year": 2019, "film_type": "документальный полнометражный фильм"}, "details": {"countries": ["Норвегия", "Германия"], "languages": ["английский", "немецкий", "корейский"], "genres": ["документальный", "искусство"], "runtime_minutes": 102, "age_ratings": [{"country": "Россия", "rating": "18+", "source_ids": ["afisha"]}], "color": "цветной", "aspect_ratio": "1.78:1"}, "creators": {"directors": ["Томми Гулликсен"], "screenwriters": ["Томми Гулликсен"], "producers": ["Бенедикте Даниэльсен", "Эйрин О. Хёгтвейт", "Андреас Гутцайт", "Линн Аронсен"], "cinematographers": ["Свен Эрлинг Бруслетто"], "composers": ["Хьетиль Рёст Нильсен", "Ник Новак", "Такуми Мотокава", "Франк Цербан"], "editors": ["Уве Климмек"], "production_companies": ["Norsk Fjernsyn AS", "Story House Productions"], "source_material": null}, "cast": [{"name_ru": "Мортен Тровик", "name_original": "Morten Traavik", "role": "участник, художник и организатор культурного обмена", "participation_type": "документальный участник", "source_ids": ["primary", "imdb", "beat"]}, {"name_ru": "Хенрик Плахт", "name_original": "Henrik Placht", "role": "участник, художник", "participation_type": "документальный участник", "source_ids": ["primary", "imdb", "beat"]}, {"name_ru": "Ник Новак", "name_original": "Nik Nowak", "role": "участник, художник, работающий со звуком", "participation_type": "документальный участник", "source_ids": ["primary", "imdb", "beat"]}, {"name_ru": "Кэти Бойд", "name_original": "Cathie Boyd", "role": "участница, театральный режиссёр", "participation_type": "документальный участник", "source_ids": ["primary", "imdb", "beat"]}, {"name_ru": "Квентин Ши", "name_original": "Quentin Shih", "role": "участник, фотограф и художник", "participation_type": "документальный участник", "source_ids": ["primary", "imdb", "beat"]}], "content": {"logline": "Художники приезжают в Северную Корею ради культурного обмена и сталкиваются с несовпадающими представлениями об искусстве и свободе.", "synopsis": "Группа международных художников отправляется в Пхеньян по инициативе Мортена Тровика. Участники рассчитывают познакомиться с северокорейскими коллегами, обменяться опытом и создать пространство для совместной работы. Но уже первые встречи обнаруживают, насколько по-разному стороны понимают назначение искусства, роль автора и допустимые способы выражения. Разговоры о красоте, технике и личном опыте постоянно затрагивают вопросы идеологии, доверия и культурных границ. Камера следует за гостями во время поездки, фиксируя профессиональное любопытство, неловкость, споры и попытки найти общий язык. Вместо готовой истории о взаимопонимании возникает наблюдение за самим процессом контакта. Каждый участник приносит собственные ожидания и привычные оценки, которые встреча заставляет проверять. Фильм предлагает смотреть на культурный обмен как на трудную практику, где искренний интерес соседствует с ограничениями, недоразумениями и неравенством возможностей.", "themes": ["свобода искусства", "культурный обмен", "идеология", "границы взаимопонимания"], "mood": "Любопытное, ироничное и напряжённое; комизм недоразумений соседствует с дискомфортом.", "visual_style": "Документальное наблюдение за встречами и разговорами, контраст официальных пространств с рабочими ситуациями; визуальный материал показывает условия контакта, а не только произведения искусства."}, "context": {"text": "Норвежский режиссёр Томми Гулликсен снимает международный художественный обмен, организованный Мортеном Тровиком в Северной Корее. Картина создана как норвежско-германская копродукция; её российская фестивальная история связана с Beat Film Festival. Предмет исследования — не обзор северокорейского искусства вообще, а конкретная встреча художников с различным опытом и разными институциональными ограничениями. Редакционная интерпретация: документальный интерес возникает там, где привычные представления участников перестают работать. Фильм позволяет обсуждать не только государственное регулирование культуры, но и ожидания приезжих, стремящихся увидеть в собеседниках подтверждение собственных идей. Для описания важно сохранять статус реальных участников и не превращать их в вымышленных персонажей или условных представителей целых стран.", "facts": [{"text": "Режиссёр фильма — Томми Гулликсен; Мортен Тровик выступает участником и организатором обмена.", "source_ids": ["primary", "beat"]}, {"text": "Полнометражная картина является копродукцией Норвегии и Германии.", "source_ids": ["primary"]}, {"text": "Фильм победил в норвежском документальном конкурсе HUMAN в 2019 году.", "source_ids": ["human"]}]}, "release": {"world_premiere": {"date": "28022019", "year": 2019, "event": "Норвегия: первый зарегистрированный показ", "release_type": "documented_first_release", "source_ids": ["nb"]}, "russian_premiere": {"date": null, "year": 2019, "event": "Beat Film Festival, Россия", "release_type": "festival_premiere", "source_ids": ["beat"]}, "additional_releases": []}, "recognition": {"awards": [{"year": 2019, "event": "HUMAN International Documentary Film Festival", "category": "Норвежский документальный конкурс", "recipient": "War of Art / Томми Гулликсен", "result": "win", "source_ids": ["human"]}]}, "finances": {"budget": {"amount": 6003670, "currency": "NOK", "estimated": true, "source_ids": ["imdb"]}, "worldwide_gross": null}, "ratings": {"kinopoisk": {"value": 7.4, "scale": 10, "votes": 1139, "votes_approximate": false, "checked_on": "24092026", "source_ids": ["kp_list"]}, "imdb": {"value": 7.0, "scale": 10, "votes": 135, "votes_approximate": false, "checked_on": "24092026", "source_ids": ["imdb"]}}, "links": {"official_trailer": {"url": "https://www.filmportal.de/video/war-of-art-2019", "link_type": "trailer_page", "language": "Оригинальная звуковая дорожка / субтитры по странице", "sou ает собственной биографией. Их рассказы ведут от семейных магазинов и тесных складов к крупным ярмаркам и неожиданным находкам. Одни собеседники вспоминают исчезающие традиции торговли, другие объясняют, как интернет и новое поколение собирателей меняют профессию. Разговор постепенно выходит за пределы редкостей и высоких цен: кто определяет культурную ценность, какие истории достойны сохранения и кому доступно коллекционирование? Фильм соединяет удовольствие от книжного изобилия с вниманием к повседневной работе людей, поддерживающих жизнь этой городской среды.", "themes": ["книга как культурный объект", "сохранение памяти", "коллекционирование", "смена поколений"], "mood": "Тёплое, любознательное и разговорное; ностальгия сочетается с интересом к будущему.", "visual_style": "Интервью и наблюдения в магазинах, архивах и на ярмарках; крупные планы переплётов и заполненные книгами пространства подчёркивают материальность предмета."}, "context": {"text": "Д. У. Янг обращается к нью-йоркской торговле редкими книгами как к живой профессиональной среде. Паркер Поузи участвует в картине как рассказчица и исполнительный продюсер. После премьеры на Нью-Йоркском кинофестивале в 2019 году фильм вышел в американский прокат в 2020-м; в России его показывали в программе Beat. Редакционная интерпретация: интерес картины не сводится к ностальгии по магазинам до интернета. Герои обсуждают, как меняются покупатели, каналы поиска и сами представления о достойном коллекции материале. Через частные истории становится виден вопрос культурной памяти: сохранность книг зависит не только от библиотек, но и от личной увлечённости, рынка, семейной преемственности и труда небольших независимых предприятий.", "facts": [{"text": "Д. У. Янг выступил режиссёром, монтажёром и одним из продюсеров картины.", "source_ids": ["catalog", "selection"]}, {"text": "Паркер Поузи — рассказчица и исполнительный продюсер фильма.", "source_ids": ["primary", "official"]}, {"text": "Первый фестивальный показ состо
